<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills de Pato</title><style>:root{--bg:#0b1020;--panel:#11182b;--panel2:#151e35;--text:#eef2ff;--muted:#9ba7c4;--line:#27314d;--accent:#7c8cff;--accent2:#40d9b4;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#182650 0,#0b1020 42%,#080c17 100%);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 20px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand h1{font-size:30px;margin:0 0 5px}.brand p{margin:0;color:var(--muted)}.tabs{display:flex;background:#0f1629;border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:var(--panel2);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:18px;padding:18px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:28px;font-weight:800;margin-top:6px}.panel{background:rgba(17,24,43,.82);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(10px)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.search{flex:1;max-width:420px;background:#0c1325;border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px 13px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:linear-gradient(180deg,#151e35,#11182b);border:1px solid var(--line);border-radius:18px;padding:19px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto auto 0;width:5px;height:100%;background:linear-gradient(var(--accent),var(--accent2))}.tag{display:inline-flex;border:1px solid #34405f;background:#10182b;color:#aeb9d6;border-radius:999px;padding:5px 9px;font-size:12px;margin-bottom:11px}.name{font-size:21px;font-weight:800;line-height:1.2}.desc{color:var(--muted);margin:8px 0 14px;line-height:1.45}.mini{display:flex;gap:14px;color:#7f8baa;font-size:12px;margin-bottom:16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#18213a;color:#fff;padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:750;text-decoration:none}.btn.primary{background:linear-gradient(135deg,#6e7cff,#8d67ff);border-color:transparent}.btn:hover{filter:brightness(1.08)}.dashboard{display:none}.dashboard.active,.library.active{display:block}.library:not(.active){display:none}.charts{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.chartbox h3{margin:0 0 16px;font-size:16px}.bars{display:flex;flex-direction:column;gap:13px}.barrow{display:grid;grid-template-columns:180px 1fr 36px;gap:10px;align-items:center}.barlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dbe2fa;font-size:13px}.track{height:10px;background:#0a1120;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}.barval{text-align:right;color:var(--muted);font-size:12px}.donutWrap{display:flex;align-items:center;justify-content:center;min-height:240px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--accent) 0 var(--p),var(--accent2) var(--p) 100%);position:relative}.donut:after{content:"";position:absolute;inset:28px;border-radius:50%;background:var(--panel)}.donutCenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;text-align:center;font-weight:800}.legend{display:flex;gap:14px;justify-content:center;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.activity{margin-top:16px}.activity table{width:100%;border-collapse:collapse}.activity th,.activity td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.activity th{color:var(--muted);font-weight:650}.empty{color:var(--muted);padding:26px 0;text-align:center}.detail{display:none}.detail.active{display:block}.detailCard{max-width:820px;margin:auto}.back{display:inline-block;color:#b8c4e6;text-decoration:none;margin-bottom:16px}.detail h2{font-size:30px;margin:0 0 8px}.detail .copybox{background:#0a1120;border:1px solid var(--line);padding:16px;border-radius:14px;color:#c5d0ee;white-space:pre-wrap;line-height:1.55;margin:18px 0}.notice{border:1px solid #4a3f24;background:#1d1a11;color:#ecd894;padding:12px 14px;border-radius:12px;font-size:13px;margin-top:16px}.notes{margin-top:18px}.notes h3{margin:0 0 8px}.notes p{margin:0 0 12px;color:var(--muted);font-size:13px}.notes textarea{width:100%;min-height:130px;resize:vertical;background:#0a1120;border:1px solid var(--line);color:#eef2ff;border-radius:14px;padding:14px;line-height:1.5;outline:none}.notes textarea:focus{border-color:#5365a8;box-shadow:0 0 0 3px rgba(124,140,255,.12)}.saveRow{display:flex;align-items:center;gap:10px;margin-top:10px}.saved{color:var(--accent2);font-size:12px;opacity:0;transition:.2s}.saved.show{opacity:1}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.charts{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.barrow{grid-template-columns:120px 1fr 30px}}</style></head><body><main class="shell"><div id="app"></div></main><script>const skills=[{"id":"prueba-propuestas-modificacion-clases","name":"Prueba propuestas modificación clases (TRIMESTRES sep 26)","category":"Fairplay · Clases","desc":"Analiza propuestas de cambios de clases, grupos, horarios y alumnos sin modificar datos sin autorización.","github":"https://github.com/Duckiller6/mis-skills/blob/main/prueba-propuestas-modificacion-clases/SKILL.md","instructions":"---\nname: prueba-propuestas-modificacion-clases\ndescription: Analiza propuestas de cambios relacionadas con clases, grupos, horarios, alumnos y organización de Fairplay Padel, pero no modifica archivos, hojas, documentos ni datos sin autorización explícita del usuario. Nombre visible: Prueba propuestas modificación clases (TRIMESTRES sep 26).\n---\n\n# Nombre visible\n**Prueba propuestas modificación clases (TRIMESTRES sep 26)**\n\n# Objetivo\nAyudar a revisar, comparar y preparar cambios en la organización de clases de Fairplay Padel sin aplicar modificaciones por defecto.\n\n# Regla principal\n**No modificar archivos, hojas de cálculo, documentos, reservas, grupos, horarios ni datos sin una instrucción explícita del usuario para hacerlo.**\n\nEl comportamiento por defecto es:\n1. analizar,\n2. detectar problemas,\n3. proponer cambios,\n4. mostrar exactamente qué cambiaría,\n5. esperar autorización antes de aplicar nada.\n\n# Qué puede analizar\n- altas y bajas de alumnos,\n- cambios de grupos,\n- cambios de horario,\n- sustituciones de profesor,\n- nivel de alumnos,\n- compatibilidad entre alumnos,\n- huecos libres,\n- composición de grupos,\n- trimestre de septiembre de 2026,\n- conflictos entre disponibilidad, nivel y horario,\n- impacto de una modificación sobre otros grupos.\n\n# Criterios de nivel\nCuando se trabaje con la hoja de alumnos y existan varias fuentes de nivel, usar esta prioridad:\n1. columna **NIVEL (E)**,\n2. si está vacía, usar **YO**,\n3. si también está vacía, usar **NIVEL TABLA**.\n\nNo promediar ni sustituir un valor si ya existe un nivel válido en una fuente de mayor prioridad.\n\n# Grupos libres\nCuando se analicen grupos disponibles, considerar como grupo existente/libre el que tenga nombre de grupo en la **columna B**, según la estructura de trabajo definida por el usuario.\n\n# Flujo de trabajo\nAnte una solicitud de cambio:\n\n## 1. Entender el cambio pedido\nIdentificar:\n- alumno o grupo afectado,\n- horario actual,\n- horario propuesto,\n- nivel,\n- profesor si corresponde,\n- restricciones relevantes.\n\n## 2. Revisar consecuencias\nComprobar:\n- compatibilidad de nivel,\n- disponibilidad,\n- tamaño del grupo,\n- posibles choques de horario,\n- alumnos que quedarían afectados,\n- si el cambio genera otro hueco o problema.\n\n## 3. Proponer\nPresentar una propuesta concreta con este formato cuando sea útil:\n\n### Cambio propuesto\n- Actual:\n- Propuesta:\n- Motivo:\n- Personas afectadas:\n- Riesgos o dudas:\n\n## 4. Esperar autorización\nSi el cambio implica editar datos reales, terminar indicando que la propuesta está lista para aplicar y esperar una orden explícita como:\n- “aplicalo”,\n- “hacé el cambio”,\n- “modificalo”,\n- “sí, cambialo”.\n\nNo interpretar una mera consulta o análisis como autorización para modificar.\n\n# Cuando el usuario diga “ok”\nSi inmediatamente antes se propuso una acción concreta y el usuario responde únicamente **“ok”**, interpretar que acepta esa acción concreta y ejecutarla, siempre que exista acceso y permisos suficientes.\n\n# Seguridad de cambios\nAntes de aplicar una modificación real:\n- confirmar internamente qué filas/celdas/registros se van a tocar,\n- limitar el cambio solo a lo pedido,\n- no hacer limpiezas, reorganizaciones ni mejoras adicionales no solicitadas,\n- informar después exactamente qué se modificó.\n\n# Estilo de respuesta\n- Claro y corto.\n- Priorizar tablas cuando haya varias alternativas.\n- No llenar la respuesta de teoría.\n- Señalar cualquier dato dudoso como dudoso en vez de inventarlo."},{"id":"aeat-explicador-entrenador-test","name":"AEAT — Explicador y entrenador de test","category":"AEAT · Estudio","desc":"Explica normativa y preguntas de Agente de Hacienda y entrena con tests adaptativos, ejemplos y trampas típicas.","github":"https://github.com/Duckiller6/mis-skills/blob/main/aeat-explicador-entrenador-test/SKILL.md","instructions":"---\nname: aeat-explicador-entrenador-test\ndescription: Explica normativa y preguntas de la oposición de Agente de Hacienda Pública (AEAT, C1) de forma simple y entrena con tests adaptativos, ejemplos y trampas típicas. Úsala cuando el usuario quiera estudiar, entender, repasar o practicar legislación tributaria y materias de la oposición AEAT.\n---\n\n# Objetivo\nConvertir cualquier artículo, concepto, pregunta tipo test, captura, apunte o duda de la oposición de Agente de Hacienda Pública en una explicación clara y útil para examen, seguida de práctica adaptativa.\n\n# Principios de trabajo\n- Hablar en castellano claro, natural y directo.\n- Priorizar comprensión antes que memorización.\n- No asumir que una respuesta propuesta por el usuario es correcta: comprobarla.\n- No inventar artículos, plazos, porcentajes, excepciones ni jurisprudencia.\n- Cuando la respuesta dependa de normativa vigente o pueda haber cambiado, verificar en fuentes oficiales actuales antes de afirmarla. Priorizar BOE y AEAT.\n- Si el usuario aporta un PDF, temario o material de academia y pide trabajar sobre él, usar ese material como fuente principal y señalar cualquier discrepancia relevante con la normativa vigente.\n- Diferenciar siempre entre “regla general”, “excepción” y “trampa de examen” cuando existan.\n\n# Flujo por defecto\nAnte una pregunta, artículo o concepto:\n\n1. **Respuesta corta**\n   - Dar primero la conclusión en 1-3 frases.\n\n2. **Explicación fácil**\n   - Explicar el concepto como si el usuario ya tuviera una base pero necesitara entender la lógica.\n   - Evitar lenguaje jurídico innecesario.\n\n3. **Ejemplo concreto**\n   - Usar números, fechas o una situación tributaria sencilla cuando ayude.\n\n4. **Qué tenés que recordar para el examen**\n   - Resumir la regla en una frase memorizable.\n\n5. **Trampa típica**\n   - Señalar confusiones frecuentes: plazos parecidos, órganos distintos, efectos jurídicos, excepciones, conceptos con nombres similares, etc.\n\n6. **Mini-test adaptativo**\n   - Salvo que el usuario pida solo explicación, formular 3 preguntas tipo test de dificultad progresiva.\n   - Cada pregunta debe tener 4 opciones: A, B, C y D.\n   - No mostrar la solución hasta que el usuario responda, salvo que pida expresamente las respuestas.\n\n7. **Corrección**\n   - Tras la respuesta del usuario, indicar acierto/error y explicar por qué.\n   - Explicar también por qué las alternativas incorrectas son incorrectas cuando aporte valor.\n\n# Entrenamiento adaptativo\nDurante la conversación activa:\n- Llevar una lista mental de conceptos fallados, dudas repetidas y trampas que hayan confundido al usuario.\n- Reintroducir esos conceptos más adelante con formulaciones distintas.\n- Incrementar dificultad cuando encadene respuestas correctas.\n- Si falla dos veces el mismo concepto, volver a explicación + ejemplo antes de seguir testeando.\n- No afirmar que este registro persiste fuera de la conversación salvo que exista una función de memoria y se haya guardado expresamente.\n\n# Modo pregunta de examen\nSi el usuario pega una pregunta tipo test:\n- Identificar la opción correcta.\n- Explicar la razón jurídica exacta.\n- Señalar la palabra o frase de la pregunta que decide la respuesta.\n- Explicar por qué la opción elegida por el usuario es correcta o incorrecta.\n- Si la pregunta está mal redactada, desactualizada o admite más de una interpretación, decirlo claramente.\n\n# Modo artículo\nSi el usuario pide un artículo concreto:\n- Explicar primero qué regula.\n- Separar apartados relevantes.\n- Traducir cada apartado a lenguaje sencillo.\n- Añadir un ejemplo.\n- Cerrar con “Para el examen” y una síntesis de 1-3 puntos.\n- Si el literal exacto es importante, citar solo el fragmento imprescindible y no reproducir extensamente la norma.\n\n# Modo repaso\nSi el usuario dice “repasame”, “preguntame”, “haceme un test” o equivalente:\n- Empezar directamente por preguntas.\n- Mezclar conceptos ya trabajados con otros cercanos.\n- Variar entre definición, plazo, efecto jurídico, excepción y caso práctico.\n- Corregir después de que conteste.\n\n# Formato recomendado\nUsar encabezados breves cuando ayuden:\n- **Respuesta**\n- **Por qué**\n- **Ejemplo**\n- **Para el examen**\n- **Trampa típica**\n- **Mini-test**\n\nNo convertir cada respuesta en una explicación enorme si la duda es sencilla."},{"id":"analizador-subastas-aeat-boe","name":"Analizador de subastas AEAT/BOE","category":"Inversión · Subastas","desc":"Analiza subastas de AEAT y BOE revisando propiedad, cargas, riesgos, mercado, rentabilidad y precio máximo orientativo.","github":"https://github.com/Duckiller6/mis-skills/blob/main/analizador-subastas-aeat-boe/SKILL.md","instructions":"---\nname: analizador-subastas-aeat-boe\ndescription: Analiza subastas de la AEAT y del BOE, especialmente inmuebles, garajes y participaciones, revisando qué se subasta, porcentaje de propiedad, cargas, valoración, depósito, ubicación, riesgos, alquiler potencial, rentabilidad y precio máximo orientativo. Úsala para evaluar una subasta concreta o comparar varias oportunidades.\n---\n\n# Objetivo\nConvertir la información dispersa de una subasta AEAT/BOE en una ficha de inversión clara, verificable y accionable, con riesgos explícitos y un veredicto final.\n\n# Regla esencial\nNunca confundir:\n- valor de tasación,\n- tipo de subasta,\n- puja mínima,\n- depósito,\n- deuda reclamada,\n- cargas anteriores,\n- cargas que se cancelan,\n- precio real de mercado.\n\nSi un dato no aparece o no puede verificarse, escribir **“No consta / no verificado”**. No inventarlo.\n\n# Fuentes\nCuando la subasta sea actual o exista un enlace público:\n- Consultar la ficha oficial de la subasta.\n- Priorizar BOE, Portal de Subastas, AEAT, Catastro/Registro cuando haya datos públicos utilizables y documentos oficiales asociados.\n- Para mercado de venta o alquiler, usar fuentes inmobiliarias recientes y comparables razonables.\n- Indicar claramente qué datos son oficiales y cuáles son estimaciones de mercado.\n\n# Flujo de análisis\n\n## 1. Identificar exactamente qué se subasta\nDeterminar:\n- tipo de bien,\n- dirección o localización,\n- referencia catastral si consta,\n- finca registral si consta,\n- porcentaje de pleno dominio,\n- nuda propiedad/usufructo u otro derecho,\n- anexos incluidos,\n- si se subasta una plaza completa o una cuota indivisa.\n\nEste punto debe aparecer al principio porque puede cambiar por completo la inversión.\n\n## 2. Datos económicos oficiales\nExtraer, cuando consten:\n- valoración/tasación,\n- tipo de subasta,\n- importe del depósito,\n- puja mínima si existe,\n- tramos de puja,\n- deuda o responsabilidad reclamada si es relevante,\n- fecha de inicio y cierre.\n\n## 3. Cargas y situación jurídica\nSeparar en una tabla o lista:\n- cargas anteriores/preferentes,\n- cargas posteriores,\n- hipotecas,\n- embargos,\n- afecciones fiscales,\n- servidumbres,\n- arrendamientos u ocupantes si constan,\n- deudas de comunidad/IBI si hay información,\n- cualquier limitación de uso o transmisión.\n\nNo afirmar que una carga se cancela solo por aparecer como posterior. Explicar qué puede deducirse con seguridad y qué requiere nota simple, certificación registral o asesoramiento profesional.\n\n## 4. Posesión y ocupación\nIndicar:\n- si consta libre u ocupado,\n- si existe arrendatario,\n- si se desconoce,\n- coste/riesgo potencial de obtener posesión.\n\nSi no hay evidencia, decir “situación posesoria no verificada”.\n\n## 5. Mercado\nEstimar por separado:\n- valor de venta razonable,\n- alquiler mensual razonable,\n- rango conservador y rango probable,\n- comparables utilizados cuando sea posible.\n\nNo usar un único anuncio como referencia suficiente. Preferir varios comparables cercanos y similares.\n\n## 6. Costes de adquisición\nContemplar según el caso:\n- importe de adjudicación,\n- impuestos,\n- Registro/Notaría si proceden,\n- cargas que deba asumir el adjudicatario,\n- deuda de comunidad/IBI potencial,\n- gastos de posesión/desalojo,\n- reforma o puesta a punto,\n- comisión/intermediación si existiera.\n\nSi no se puede calcular con precisión, usar escenarios y explicar supuestos.\n\n## 7. Rentabilidad\nCalcular cuando haya datos suficientes:\n- rentabilidad bruta anual = alquiler anual / coste total estimado,\n- rentabilidad neta aproximada si pueden estimarse gastos,\n- descuento frente a mercado,\n- margen potencial de reventa.\n\nNo presentar una rentabilidad como exacta si depende de supuestos.\n\n## 8. Precio máximo orientativo\nProponer un **precio máximo de puja** solo si hay información suficiente.\nDebe surgir de:\n- valor de mercado conservador,\n- costes adicionales,\n- riesgos,\n- margen mínimo deseado.\n\nMostrar la lógica del cálculo. Si faltan cargas, porcentaje de propiedad o situación posesoria, no dar un precio máximo cerrado; dar un límite condicionado.\n\n# Semáforo de riesgo\nClasificar cada área:\n- 🟢 Bajo\n- 🟡 Medio\n- 🔴 Alto\n\nÁreas mínimas:\n- propiedad/derecho subastado,\n- cargas,\n- ocupación,\n- documentación,\n- precio frente a mercado,\n- liquidez/alquiler.\n\n# Veredicto final\nCerrar siempre con uno de estos:\n- **INTERESANTE**: riesgo razonable y descuento suficiente.\n- **DUDOSA**: puede tener sentido, pero faltan datos o el margen es ajustado.\n- **DESCARTAR**: riesgo, cargas, porcentaje de propiedad o precio hacen poco atractiva la operación.\n\nAñadir en una línea el motivo principal.\n\n# Formato de salida por defecto\n\n## Resumen\n- Bien:\n- Ubicación:\n- Derecho/porcentaje subastado:\n- Valoración oficial:\n- Depósito:\n- Cierre:\n\n## Lo más importante\nExplicar en 2-5 puntos qué puede hacer ganar o perder dinero en esta subasta.\n\n## Cargas y riesgos\nTabla con concepto, estado, impacto y nivel de riesgo.\n\n## Mercado y rentabilidad\nTabla con venta estimada, alquiler estimado, coste total, rentabilidad y descuento.\n\n## Precio máximo orientativo\nMostrar cálculo y supuestos.\n\n## Antes de pujar\nLista concreta de comprobaciones pendientes.\n\n## Veredicto\n**INTERESANTE / DUDOSA / DESCARTAR** — razón principal.\n\n# Comparación de varias subastas\nCuando haya varias:\n- aplicar exactamente los mismos criterios a todas,\n- hacer una tabla comparativa,\n- ordenar de mejor a peor oportunidad,\n- explicar en una frase por qué cada una ocupa esa posición,\n- penalizar fuertemente cuotas indivisas, cargas inciertas y ocupación no resuelta.\n\n# Límites\nEsto es análisis de inversión, no una certificación registral ni asesoramiento jurídico. Cuando una conclusión dependa de información no pública o registral, indicar qué documento hace falta para cerrarla."}];const KEY='pato_skill_stats_v2',NOTES_KEY='pato_skills_notes_v1';function getStats(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}function saveStats(s){localStorage.setItem(KEY,JSON.stringify(s))}function ensure(s,id){if(!s[id])s[id]={opens:0,copies:0,last:null};return s[id]}function record(id,type){const s=getStats(),x=ensure(s,id);x[type]=(x[type]||0)+1;x.last=new Date().toISOString();saveStats(s)}function skillUrl(id){return location.origin+location.pathname+'?skill='+encodeURIComponent(id)}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function copyLink(id,b){const url=skillUrl(id);try{await navigator.clipboard.writeText(url)}catch{const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}record(id,'copies');b.textContent='✓ Link copiado';setTimeout(()=>b.textContent='Copiar link',1300)}function openSkill(id){const s=skills.find(x=>x.id===id);record(id,'opens');if(s&&s.github){window.open(s.github,'_blank','noopener')}else{location.href=skillUrl(id)}}function totals(){const s=getStats();let opens=0,copies=0,last=null,top=null,topN=-1;skills.forEach(k=>{const x=ensure(s,k.id);opens+=x.opens||0;copies+=x.copies||0;if(x.last&&(!last||x.last>last))last=x.last;if((x.opens||0)>topN){topN=x.opens||0;top=k}});return{s,opens,copies,last,top,topN}}function getNote(){const x=localStorage.getItem(NOTES_KEY);return x===null?'CHICHA MALA, CHICHO BUENO':x}function saveNote(){const ta=document.getElementById('notesBox');localStorage.setItem(NOTES_KEY,ta.value);const s=document.getElementById('savedMsg');s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1200)}function notesBlock(){return `<section class="panel notes"><h3>Notas</h3><p>Podés escribir, borrar o modificar lo que quieras. Se guarda en este navegador.</p><textarea id="notesBox" placeholder="Escribí tus notas acá…">${esc(getNote())}</textarea><div class="saveRow"><button class="btn primary" onclick="saveNote()">Guardar nota</button><span class="saved" id="savedMsg">✓ Guardado</span></div></section>`}function renderMain(){const t=totals();document.getElementById('app').innerHTML=`<section class="top"><div class="brand"><h1>Skills de Pato</h1><p>Tu biblioteca personal de habilidades reutilizables.</p></div><div class="tabs"><button class="tab active" data-tab="library">Biblioteca</button><button class="tab" data-tab="dashboard">Dashboard</button></div></section><section class="stats"><div class="stat"><div class="label">Skills</div><div class="value">${skills.length}</div></div><div class="stat"><div class="label">Aperturas</div><div class="value">${t.opens}</div></div><div class="stat"><div class="label">Links copiados</div><div class="value">${t.copies}</div></div><div class="stat"><div class="label">Más usada</div><div class="value" style="font-size:17px;line-height:1.25">${t.topN>0?esc(t.top.name):'Sin datos aún'}</div></div></section><section class="library active panel"><div class="toolbar"><input id="search" class="search" placeholder="Buscar una skill…"><span class="count">${skills.length} skills</span></div><div class="grid" id="cards"></div></section><section class="dashboard"><div class="charts"><div class="panel chartbox"><h3>Aperturas por skill</h3><div id="barChart" class="bars"></div></div><div class="panel chartbox"><h3>Interacciones</h3><div id="donut"></div></div></div><div class="panel activity"><h3>Actividad y uso</h3><div id="activity"></div><div class="notice">Las estadísticas empiezan a contar desde esta versión y se guardan en este navegador. No incluyen usos de la skill dentro de otros chats de ChatGPT.</div></div></section>${notesBlock()}`;renderCards(skills);renderDashboard();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.library').classList.toggle('active',b.dataset.tab==='library');document.querySelector('.dashboard').classList.toggle('active',b.dataset.tab==='dashboard')});document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();renderCards(skills.filter(s=>(s.name+' '+s.desc+' '+s.category).toLowerCase().includes(q)))}}function renderCards(list){const t=totals();const box=document.getElementById('cards');box.innerHTML=list.map(s=>{const x=ensure(t.s,s.id);return `<article class="card"><span class="tag">${esc(s.category)}</span><div class="name">${esc(s.name)}</div><div class="desc">${esc(s.desc)}</div><div class="mini"><span>↗ ${x.opens||0} aperturas</span><span>🔗 ${x.copies||0} copias</span></div><div class="actions"><button class="btn primary" onclick="openSkill('${s.id}')">Abrir SKILL.md</button><a class="btn" href="${skillUrl(s.id)}">Ver ficha</a><button class="btn" onclick="copyLink('${s.id}',this)">Copiar link</button></div></article>`}).join('')||'<div class="empty">No encontré ninguna skill con ese texto.</div>'}function renderDashboard(){const t=totals(),max=Math.max(1,...skills.map(s=>ensure(t.s,s.id).opens||0));document.getElementById('barChart').innerHTML=skills.map(s=>{const n=ensure(t.s,s.id).opens||0;return `<div class="barrow"><div class="barlabel" title="${esc(s.name)}">${esc(s.name)}</div><div class="track"><div class="fill" style="width:${(n/max)*100}%"></div></div><div class="barval">${n}</div></div>`}).join('');const all=t.opens+t.copies,pct=all?Math.round(t.opens/all*100):50;document.getElementById('donut').innerHTML=`<div class="donutWrap"><div class="donut" style="--p:${pct}%"><div class="donutCenter">${all}<br><span style="font-size:12px;color:var(--muted);font-weight:600">acciones</span></div></div></div><div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Aperturas ${t.opens}</span><span><i class="dot" style="background:var(--accent2)"></i>Copias ${t.copies}</span></div>`;document.getElementById('activity').innerHTML=`<table><thead><tr><th>Skill</th><th>Aperturas</th><th>Copias</th><th>Último uso</th></tr></thead><tbody>${skills.map(s=>{const x=ensure(t.s,s.id);return `<tr><td>${esc(s.name)}</td><td>${x.opens||0}</td><td>${x.copies||0}</td><td>${x.last?new Date(x.last).toLocaleString('es-ES'):'—'}</td></tr>`}).join('')}</tbody></table>`}function renderDetail(skill){document.getElementById('app').innerHTML=`<section class="detail active"><div class="panel detailCard"><a class="back" href="${location.pathname}">← Volver a la biblioteca</a><span class="tag">${esc(skill.category)}</span><h2>${esc(skill.name)}</h2><p class="desc">${esc(skill.desc)}</p><div class="copybox">${esc(skill.instructions)}</div><div class="actions"><a class="btn primary" href="${skill.github}" target="_blank" rel="noopener" onclick="record('${skill.id}','opens')">Abrir SKILL.md</a><button class="btn" onclick="copyPrompt(this,'${skill.id}')">Copiar instrucciones</button><button class="btn" onclick="copyLink('${skill.id}',this)">Copiar link de la skill</button></div><div class="notice">Esta ficha muestra las instrucciones completas. El botón “Abrir SKILL.md” abre el archivo fuente actualizado en GitHub.</div></div></section>${notesBlock()}`}async function copyPrompt(b,id){const s=skills.find(x=>x.id===id);try{await navigator.clipboard.writeText(s.instructions)}catch{const t=document.createElement('textarea');t.value=s.instructions;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.textContent='✓ Instrucciones copiadas';setTimeout(()=>b.textContent='Copiar instrucciones',1400)}const aliases={'clasificar-agrupar-alumnos-padel':'prueba-propuestas-modificacion-clases','propuestas-modificacion-clases':'prueba-propuestas-modificacion-clases'};const q=new URLSearchParams(location.search).get('skill');const h=location.hash?location.hash.slice(1):'';const p=aliases[q]||aliases[h]||q||h;const sk=skills.find(x=>x.id===p);if(sk)renderDetail(sk);else renderMain();</script></body></html>
