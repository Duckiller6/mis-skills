<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skills de Pato</title>
<style>
:root{--bg:#0b1020;--panel:#11182b;--panel2:#151e35;--text:#eef2ff;--muted:#9ba7c4;--line:#27314d;--accent:#7c8cff;--accent2:#40d9b4;--warn:#ffcc66}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#182650 0,#0b1020 42%,#080c17 100%);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 20px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand h1{font-size:30px;margin:0 0 5px}.brand p{margin:0;color:var(--muted)}.tabs{display:flex;background:#0f1629;border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:var(--panel2);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:rgba(17,24,43,.82);border:1px solid var(--line);border-radius:18px;padding:18px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:28px;font-weight:800;margin-top:6px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.search,.runnerPrompt{background:#0c1325;border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px 13px;outline:none}.search{flex:1;max-width:420px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:linear-gradient(180deg,#151e35,#11182b);border:1px solid var(--line);border-radius:18px;padding:19px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto auto 0;width:5px;height:100%;background:linear-gradient(var(--accent),var(--accent2))}.tag{display:inline-flex;border:1px solid #34405f;background:#10182b;color:#aeb9d6;border-radius:999px;padding:5px 9px;font-size:12px;margin-bottom:11px}.name{font-size:21px;font-weight:800;line-height:1.2}.desc{color:var(--muted);margin:8px 0 14px;line-height:1.45}.mini{display:flex;gap:14px;color:#7f8baa;font-size:12px;margin-bottom:16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#18213a;color:#fff;padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:750;text-decoration:none}.btn.primary{background:linear-gradient(135deg,#6e7cff,#8d67ff);border-color:transparent}.btn.vscode{background:#0d65a8;border-color:#1976bd}.btn.run{background:linear-gradient(135deg,#1b9f7b,#35cfa6);border-color:transparent;color:#07130f}.btn:disabled{opacity:.55;cursor:not-allowed}.dashboard{display:none}.dashboard.active,.library.active{display:block}.library:not(.active){display:none}.charts{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.bars{display:flex;flex-direction:column;gap:13px}.barrow{display:grid;grid-template-columns:180px 1fr 36px;gap:10px;align-items:center}.barlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dbe2fa;font-size:13px}.track{height:10px;background:#0a1120;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}.barval{text-align:right;color:var(--muted);font-size:12px}.activity{margin-top:16px}.activity table{width:100%;border-collapse:collapse}.activity th,.activity td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.activity th{color:var(--muted)}.detailCard{max-width:900px;margin:auto}.back{display:inline-block;color:#b8c4e6;text-decoration:none;margin-bottom:16px}.detail h2{font-size:30px;margin:0 0 8px}.copybox,.runnerResult{background:#0a1120;border:1px solid var(--line);padding:16px;border-radius:14px;color:#c5d0ee;white-space:pre-wrap;line-height:1.55;margin:18px 0;max-height:620px;overflow:auto}.runnerBox{margin:18px 0;padding:18px;border:1px solid #315546;background:#0d1b18;border-radius:16px}.runnerBox h3{margin:0 0 6px}.runnerBox p{margin:0 0 12px;color:#a9c9be;font-size:13px}.runnerPrompt{width:100%;min-height:120px;resize:vertical}.runnerResult{display:none;max-height:460px}.runnerResult.show{display:block}.notice{border:1px solid #4a3f24;background:#1d1a11;color:#ecd894;padding:12px 14px;border-radius:12px;font-size:13px;margin-top:16px}.notes{margin-top:18px}.notes textarea{width:100%;min-height:130px;resize:vertical;background:#0a1120;border:1px solid var(--line);color:#eef2ff;border-radius:14px;padding:14px}.saveRow{display:flex;align-items:center;gap:10px;margin-top:10px}.saved{color:var(--accent2);font-size:12px;opacity:0}.saved.show{opacity:1}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.charts{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.barrow{grid-template-columns:120px 1fr 30px}}
</style>
</head>
<body><main class="shell"><div id="app"></div></main>
<script>
const OWNER='Duckiller6',REPO='mis-skills',BRANCH='main';
const skills=[
{id:'clasificar-agrupar-alumnos-padel',name:'Clasificar / agrupar alumnos de pádel',category:'Fairplay · Alumnos',desc:'Busca candidatos por día, hora y nivel en el formulario oficial del trimestre y devuelve fila y celdas exactas del Sheet.',path:'clasificar-agrupar-alumnos-padel/SKILL.md'},
{id:'prueba-propuestas-modificacion-clases',name:'Prueba propuestas modificación clases (TRIMESTRES sep 26)',category:'Fairplay · Clases',desc:'Analiza propuestas de cambios de clases, grupos, horarios y alumnos sin modificar datos sin autorización.',path:'prueba-propuestas-modificacion-clases/SKILL.md'},
{id:'aeat-explicador-entrenador-test',name:'AEAT — Explicador y entrenador de test',category:'AEAT · Estudio',desc:'Explica normativa y preguntas de Agente de Hacienda y entrena con tests adaptativos, ejemplos y trampas típicas.',path:'aeat-explicador-entrenador-test/SKILL.md'},
{id:'analizador-subastas-aeat-boe',name:'Analizador de subastas AEAT/BOE',category:'Inversión · Subastas',desc:'Analiza subastas de AEAT y BOE revisando propiedad, cargas, riesgos, mercado, rentabilidad y precio máximo orientativo.',path:'analizador-subastas-aeat-boe/SKILL.md'}
];
const KEY='pato_skill_stats_v2',NOTES_KEY='pato_skills_notes_v1';
const gh=s=>`https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${s.path}`;
const raw=s=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${s.path}`;
const vs=s=>`https://vscode.dev/github.com/${OWNER}/${REPO}/blob/${BRANCH}/${s.path}`;
const skillUrl=id=>location.origin+location.pathname+'?skill='+encodeURIComponent(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function getStats(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
function ensure(s,id){if(!s[id])s[id]={opens:0,copies:0,last:null,runs:0};return s[id]}
function record(id,type){const s=getStats(),x=ensure(s,id);x[type]=(x[type]||0)+1;x.last=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(s))}
function totals(){const s=getStats();let opens=0,copies=0,runs=0,top=null,topN=-1;skills.forEach(k=>{const x=ensure(s,k.id);opens+=x.opens||0;copies+=x.copies||0;runs+=x.runs||0;if((x.opens||0)>topN){topN=x.opens||0;top=k}});return{s,opens,copies,runs,top,topN}}
async function copyLink(id,b){await navigator.clipboard.writeText(skillUrl(id));record(id,'copies');b.textContent='✓ Link copiado';setTimeout(()=>b.textContent='Copiar link',1200)}
async function useInChatGPT(id,b){const s=skills.find(x=>x.id===id);if(!s)return;const prompt=`Usá mi skill ${s.id}: ${gh(s)}\n\nLeé el SKILL.md actual y seguí sus instrucciones para lo que te pida a continuación.`;await navigator.clipboard.writeText(prompt);record(id,'copies');b.textContent='✓ Prompt copiado';setTimeout(()=>b.textContent='Usar en ChatGPT',1600)}
function getNote(){const x=localStorage.getItem(NOTES_KEY);return x===null?'CHICHA MALA, CHICHO BUENO':x}
function saveNote(){localStorage.setItem(NOTES_KEY,document.getElementById('notesBox').value);const s=document.getElementById('savedMsg');s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1200)}
function notesBlock(){return `<section class="panel notes"><h3>Notas</h3><textarea id="notesBox">${esc(getNote())}</textarea><div class="saveRow"><button class="btn primary" onclick="saveNote()">Guardar nota</button><span class="saved" id="savedMsg">✓ Guardado</span></div></section>`}
function renderMain(){const t=totals();document.getElementById('app').innerHTML=`<section class="top"><div class="brand"><h1>Skills de Pato</h1><p>Tu biblioteca personal de habilidades reutilizables.</p></div><div class="tabs"><button class="tab active" data-tab="library">Biblioteca</button><button class="tab" data-tab="dashboard">Dashboard</button></div></section><section class="stats"><div class="stat"><div class="label">Skills</div><div class="value">${skills.length}</div></div><div class="stat"><div class="label">Aperturas</div><div class="value">${t.opens}</div></div><div class="stat"><div class="label">Ejecuciones</div><div class="value">${t.runs}</div></div><div class="stat"><div class="label">Más usada</div><div class="value" style="font-size:17px;line-height:1.25">${t.topN>0?esc(t.top.name):'Sin datos aún'}</div></div></section><section class="library active panel"><div class="toolbar"><input id="search" class="search" placeholder="Buscar una skill…"><span class="count">${skills.length} skills</span></div><div class="grid" id="cards"></div></section><section class="dashboard"><div class="panel"><h3>Aperturas por skill</h3><div id="barChart" class="bars"></div></div><div class="panel activity"><h3>Actividad y uso</h3><div id="activity"></div></div></section>${notesBlock()}`;renderCards(skills);renderDashboard();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.library').classList.toggle('active',b.dataset.tab==='library');document.querySelector('.dashboard').classList.toggle('active',b.dataset.tab==='dashboard')});document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();renderCards(skills.filter(s=>(s.name+' '+s.desc+' '+s.category).toLowerCase().includes(q)))}}
function renderCards(list){const t=totals();document.getElementById('cards').innerHTML=list.map(s=>{const x=ensure(t.s,s.id);return `<article class="card"><span class="tag">${esc(s.category)}</span><div class="name">${esc(s.name)}</div><div class="desc">${esc(s.desc)}</div><div class="mini"><span>↗ ${x.opens||0} aperturas</span><span>▶ ${x.runs||0} ejecuciones</span></div><div class="actions"><a class="btn run" href="${skillUrl(s.id)}#ejecutar">▶ Ejecutar skill</a><button class="btn primary" onclick="useInChatGPT('${s.id}',this)">Usar en ChatGPT</button><a class="btn primary" href="${gh(s)}" target="_blank" onclick="record('${s.id}','opens')">Abrir SKILL.md</a><a class="btn vscode" href="${vs(s)}" target="_blank" onclick="record('${s.id}','opens')">Abrir en VS Code</a><button class="btn" onclick="copyLink('${s.id}',this)">Copiar link</button></div></article>`}).join('')}
function renderDashboard(){const t=totals(),max=Math.max(1,...skills.map(s=>ensure(t.s,s.id).opens||0));document.getElementById('barChart').innerHTML=skills.map(s=>{const n=ensure(t.s,s.id).opens||0;return `<div class="barrow"><div class="barlabel">${esc(s.name)}</div><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div><div class="barval">${n}</div></div>`}).join('');document.getElementById('activity').innerHTML=`<table><thead><tr><th>Skill</th><th>Aperturas</th><th>Ejecuciones</th><th>Copias</th></tr></thead><tbody>${skills.map(s=>{const x=ensure(t.s,s.id);return `<tr><td>${esc(s.name)}</td><td>${x.opens||0}</td><td>${x.runs||0}</td><td>${x.copies||0}</td></tr>`}).join('')}</tbody></table>`}
async function runSkill(s){const prompt=document.getElementById('runnerPrompt').value.trim(),btn=document.getElementById('runBtn'),out=document.getElementById('runnerResult');if(!prompt){out.textContent='Escribí primero qué querés pedirle a la skill.';out.classList.add('show');return}btn.disabled=true;btn.textContent='Ejecutando…';out.textContent='Ejecutando la skill…';out.classList.add('show');try{const r=await fetch('/api/run-skill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:s.id,prompt})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error al ejecutar la skill.');record(s.id,'runs');out.textContent=data.output+`\n\n— Modelo: ${data.model}`;btn.textContent='▶ Ejecutar otra vez'}catch(e){out.textContent=e.message;btn.textContent='▶ Ejecutar skill'}finally{btn.disabled=false}}
async function renderDetail(s){document.getElementById('app').innerHTML=`<section class="detail"><div class="panel detailCard"><a class="back" href="${location.pathname}">← Volver a la biblioteca</a><span class="tag">${esc(s.category)}</span><h2>${esc(s.name)}</h2><p class="desc">${esc(s.desc)}</p><div class="runnerBox" id="ejecutar"><h3>▶ Ejecutar esta skill</h3><p>Escribí qué querés hacer. La respuesta usa directamente las instrucciones de este SKILL.md.</p><textarea id="runnerPrompt" class="runnerPrompt" placeholder="Ejemplo: buscame un alumno nivel 1.5 para miércoles a las 18... / analizame esta subasta... / explicame el artículo 62 LGT..."></textarea><div class="actions" style="margin-top:10px"><button class="btn run" id="runBtn">▶ Ejecutar skill</button></div><div id="runnerResult" class="runnerResult"></div></div><div class="copybox" id="skillContent">Cargando SKILL.md…</div><div class="actions"><button class="btn primary" onclick="useInChatGPT('${s.id}',this)">Usar en ChatGPT</button><a class="btn primary" href="${gh(s)}" target="_blank">Abrir SKILL.md</a><a class="btn vscode" href="${vs(s)}" target="_blank">Abrir en VS Code</a></div><div class="notice">Para que “Ejecutar skill” funcione, Vercel necesita una variable de entorno llamada OPENAI_API_KEY. La clave queda del lado del servidor y no se muestra en la página.</div></div></section>${notesBlock()}`;document.getElementById('runBtn').onclick=()=>runSkill(s);try{const r=await fetch(raw(s),{cache:'no-store'});document.getElementById('skillContent').textContent=r.ok?await r.text():'No pude cargar el SKILL.md.'}catch{document.getElementById('skillContent').textContent='No pude cargar el SKILL.md.'}if(location.hash==='#ejecutar')setTimeout(()=>document.getElementById('runnerPrompt').focus(),100)}
const aliases={'propuestas-modificacion-clases':'prueba-propuestas-modificacion-clases'};const q=new URLSearchParams(location.search).get('skill');const h=location.hash&&location.hash!=='#ejecutar'?location.hash.slice(1):'';const p=aliases[q]||aliases[h]||q||h;const sk=skills.find(x=>x.id===p);if(sk)renderDetail(sk);else renderMain();
</script></body></html>
