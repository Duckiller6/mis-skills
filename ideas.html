<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ideas de negocio · Pato</title><style>:root{--bg:#0b1020;--card:#151c31;--text:#f5f7fb;--muted:#aab3c5;--accent:#67e8f9;--line:#29324a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#080c18,#111a31);color:var(--text)}main{max-width:1250px;margin:auto;padding:32px 18px 70px}h1{font-size:clamp(30px,5vw,54px);margin:0}.sub{color:var(--muted);margin:8px 0 28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.card{background:rgba(21,28,49,.94);border:1px solid var(--line);border-radius:18px}.stat{padding:16px}.stat b{font-size:26px;display:block}.stat span{color:var(--muted);font-size:13px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{background:#10172a;color:white;border:1px solid #33405d;border-radius:12px;padding:11px 13px;font-size:15px}.search{flex:1;min-width:240px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:20px}.tag{display:inline-block;background:#0e7490;color:#cffafe;border-radius:999px;padding:5px 9px;font-size:12px}.date{float:right;color:var(--muted);font-size:12px}.card h2{font-size:20px;margin:14px 0 10px}.row{margin:8px 0;color:#dbe2ee}.row b{color:white}.step{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;color:#cffafe}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.view-btn{background:#164e63;color:#cffafe;border:1px solid #155e75}.copy-btn{background:#67e8f9;color:#082f49}.detail{display:none;margin-top:16px;padding:16px;border:1px solid #334155;border-radius:14px;background:rgba(15,23,42,.75)}.detail.open{display:block}.detail h3{margin:0 0 8px;font-size:15px;color:#67e8f9}.description{color:#dbeafe;line-height:1.55;margin-bottom:16px}.prompt-box{white-space:pre-wrap;background:#08101f;border:1px solid #27344e;border-radius:12px;padding:13px;color:#dbeafe;font:13px/1.5 ui-monospace,monospace;max-height:260px;overflow:auto}.copy-status{font-size:12px;color:#a7f3d0;display:none}.empty{display:none;text-align:center;color:var(--muted);padding:40px}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>💡 Ideas de negocio de Pato</h1><div class="sub">Tu radar personal de oportunidades · Pádel · IA · Automatización · Inversión · Inmobiliario</div><div class="stats"><div class="stat"><b id="total">20</b><span>Ideas guardadas</span></div><div class="stat"><b id="visible">20</b><span>Mostradas</span></div><div class="stat"><b>5/día</b><span>Nuevas propuestas</span></div><div class="stat"><b>13:00</b><span>Actualización prevista</span></div></div><div class="tools"><input id="q" class="search" placeholder="Buscar idea, riesgo, categoría..."><select id="cat"><option value="">Todas las categorías</option></select><select id="eff"><option value="">Cualquier esfuerzo</option><option>Bajo</option><option>Medio</option><option>Bajo/Medio</option><option>Medio/Alto</option><option>Alto</option></select></div><div id="grid" class="grid"></div><div id="empty" class="empty">No encontré ideas con esos filtros.</div></main><script>
const ideas=[["19/09/2026","Automatizaciones simples para clubes de pádel","Pádel / Automatización","200–800 €","Medio","1–3 h/cliente","300–800 € instalación + 50–150 €/mes","Personalización y soporte","Crear paquete estándar y probarlo en Fairplay"],["19/09/2026","Producto digital de gestión para coordinadores de pádel","Pádel / Producto digital","100–500 €","Medio","<2 h/semana","49–149 € por venta","Copias y soporte","Empaquetar plantillas, hojas y manual"],["19/09/2026","Agente de WhatsApp con IA para pequeños negocios","IA / Automatización","300–1.000 €","Medio","1–3 h/cliente","150–250 €/mes por cliente","Errores del bot y APIs","Montar una demo para un negocio real"],["19/09/2026","Web automática de oportunidades de inversión y subastas","Inversión / Inmobiliario","500–2.000 €","Medio","2–4 h/semana","Suscripción 10–20 €/mes + leads","Datos incompletos","Crear radar para garajes y subastas de Barcelona"],["19/09/2026","Microempresa de automatizaciones IA con paquetes cerrados","IA / Servicios","500–1.500 €","Medio","2–5 h/semana","Paquetes + mantenimiento mensual","Consultoría a medida","Definir 3 servicios cerrados"],["19/09/2026","Local pequeño dividido en trasteros","Inmobiliario","40.000 €+","Alto","1–2 h/semana","20 trasteros x 75 € = 1.500 €/mes brutos (ejemplo)","Licencias, obra, demanda","Buscar locales baratos y validar normativa"],["19/09/2026","Gestionar pistas de pádel de terceros","Pádel / Gestión","500–2.000 €","Medio","3–6 h/semana","Fijo + porcentaje","Dependencia del propietario","Detectar 10 pistas infrautilizadas"],["19/09/2026","Cartera de plazas de parking con gestión automática","Inmobiliario / Inversión","15.000–20.000 €/plaza","Bajo","<1 h/semana","100–150 €/mes por plaza aprox.","Vacancia y derramas","Definir rentabilidad mínima y buscar primera plaza"],["19/09/2026","Academia de pádel sin club propio","Pádel / Educación","1.000–3.000 €","Medio/Alto","5–10 h/semana","Margen por grupo/hora","Ocupación y coste de pistas","Negociar horas valle y lanzar 5 grupos"],["19/09/2026","Agencia que consigue alumnos a profesores de pádel","Pádel / Leads","200–1.000 €","Medio","2–4 h/semana","10–20 €/lead o cuota profesor","Conseguir tráfico","Landing Barcelona + 10 profesores"],["20/09/2026","Recepcionista IA por teléfono para clubes y academias","IA / Pádel","300–1.000 €","Medio","1–2 h/cliente","100–250 €/mes + consumo","Errores y coste de voz","Probar en Fairplay con 20 preguntas frecuentes"],["20/09/2026","Buscador automático de compañeros de pádel","Pádel / Plataforma","200–1.000 €","Medio","2–4 h/semana","Premium 3–5 €/mes o comisión","Masa crítica","Probar sólo en Barcelona"],["20/09/2026","Radar automático de garajes con rentabilidad objetivo","Inversión / Automatización","200–1.000 € + activo","Medio","1–2 h/semana","Renta del activo filtrando compras","Datos, cargas, liquidez","Monitorear 30 días sin comprar"],["20/09/2026","Coordinador IA para clubes de pádel","Pádel / SaaS","1.000–4.000 €","Medio/Alto","2–5 h/semana","79–199 €/club/mes","Personalización por club","Automatizar 3 decisiones repetitivas"],["20/09/2026","Explotar plazas grandes para coche + motos/bicis cuando sea viable","Inmobiliario","10.000–25.000 €/plaza","Bajo","<1 h/semana","150–250 €/mes según caso","Estatutos, seguro, normativa","Analizar 20 plazas y validar legalidad"],["21/09/2026","Pádel concierge para hoteles de Barcelona","Pádel / Turismo","500–2.000 €","Medio","2–4 h/semana","Comisión 15–30 € por reserva/experiencia o fee al hotel","Estacionalidad, acuerdos y coordinación","Crear un paquete piloto de 2 horas y ofrecerlo a 10 hoteles/apartahoteles"],["21/09/2026","Americanas corporativas llave en mano para empresas","Pádel / Eventos B2B","300–1.000 €","Medio","2–5 h por evento","Margen objetivo 250–600 € por evento","Venta B2B, cancelaciones y disponibilidad de pistas","Diseñar paquete de 16–24 personas y enviarlo a 20 empresas/agencias"],["21/09/2026","Auditoría express de IA y automatización para pymes","IA / Producto-servicio","100–500 €","Bajo/Medio","1–2 h/cliente","149–299 € por auditoría + upsell","Competencia, credibilidad, protección de datos","Crear checklist de 30 puntos y hacer 3 auditorías piloto"],["21/09/2026","Micro-self-storage: comprar trasteros individuales para alquilar","Inmobiliario / Inversión","8.000–15.000 € por unidad aprox.","Bajo","<1 h/semana","Alquiler medio anunciado en Cataluña ~106 €/mes; depende de precio y gastos","Liquidez, comunidad/IBI, humedad, vacancia","Rastrear 30 trasteros y comprar sólo si supera tu rentabilidad neta objetivo"],["21/09/2026","Pack digital de onboarding y control para profesores de pádel","Pádel / Producto digital","100–400 €","Bajo/Medio","<1 h/semana tras crearlo","39–99 € por club o 9–19 €/mes","Mercado nicho, piratería y adquisición","Convertir tus procesos reales en kit mínimo de alta, sustituciones, incidencias y horas"]];
const descriptions={"Pádel concierge para hoteles de Barcelona":"Servicio B2B2C para que hoteles y alojamientos vendan a turistas una experiencia de pádel ya resuelta: pista, profesor, material y nivelación, cobrando por reserva o acuerdo recurrente.","Americanas corporativas llave en mano para empresas":"Producto cerrado de team building en pádel para empresas: pistas, formato de americana, organización, material, premios y opcionalmente bebida/comida, con margen por evento.","Auditoría express de IA y automatización para pymes":"Diagnóstico estandarizado de 60–90 minutos que detecta tareas repetitivas y oportunidades de automatización en una pyme, entregando un plan priorizado y ofreciendo después implementaciones opcionales.","Micro-self-storage: comprar trasteros individuales para alquilar":"En vez de comprar un local y hacer obra, comprar trasteros ya existentes de forma selectiva y alquilarlos uno a uno, buscando rentabilidad neta y gestión mínima.","Pack digital de onboarding y control para profesores de pádel":"Kit descargable para clubes pequeños con formularios, plantillas y procesos para altas, disponibilidad, sustituciones, incidencias y control de horas de profesores."};
function getDescription(x){return descriptions[x[1]]||`Esta propuesta busca convertir "${x[1]}" en un negocio ejecutable dentro de ${x[2]}. La idea es arrancar con una versión pequeña, validar que alguien pague y recién después escalar, manteniendo la operación lo más liviana posible.`}
function getPrompt(x){return `Quiero que actúes como un analista de negocios, emprendedor e inversor especializado en validar oportunidades reales en España.\n\nQuiero desarrollar esta idea de negocio:\n"${x[1]}"\n\nContexto de la idea:\n- Categoría: ${x[2]}\n- Inversión inicial estimada: ${x[3]}\n- Esfuerzo inicial: ${x[4]}\n- Mantenimiento estimado: ${x[5]}\n- Modelo de ingresos planteado: ${x[6]}\n- Riesgos detectados: ${x[7]}\n- Primer paso sugerido: ${x[8]}\n\nMi contexto: vivo en Barcelona, coordino una escuela de pádel, conozco profesores/alumnos/eventos y busco negocios automatizables con poco esfuerzo operativo.\n\nInvestigá mercado y competidores actuales; definí cliente, problema, diferenciación, MVP, presupuesto, precios, costes y márgenes; calculá escenarios conservador/razonable/ambicioso y clientes necesarios para 1.000 €, 3.000 € y 5.000 € netos/mes; indicá qué automatizar con IA, riesgos legales/fiscales/técnicos/comerciales en España, plan 30/90/180 días, primeros 10 pasos y señales para abandonar la idea. Cuestioná las hipótesis y marcá claramente toda cifra estimada.`}
const grid=document.querySelector('#grid'),q=document.querySelector('#q'),cat=document.querySelector('#cat'),eff=document.querySelector('#eff');[...new Set(ideas.map(x=>x[2]))].sort().forEach(x=>cat.insertAdjacentHTML('beforeend',`<option>${x}</option>`));function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let s=q.value.toLowerCase();let filtered=ideas.map((x,idx)=>({x,idx})).filter(o=>(!s||o.x.join(' ').toLowerCase().includes(s))&&(!cat.value||o.x[2]===cat.value)&&(!eff.value||o.x[4]===eff.value));grid.innerHTML=filtered.map(o=>{const x=o.x,i=o.idx,desc=getDescription(x),prompt=getPrompt(x);return `<article class="card"><span class="tag">${esc(x[2])}</span><span class="date">${esc(x[0])}</span><h2>${esc(x[1])}</h2><div class="row"><b>💶 Inversión:</b> ${esc(x[3])}</div><div class="row"><b>⚙️ Esfuerzo:</b> ${esc(x[4])} · ${esc(x[5])}</div><div class="row"><b>📈 Modelo:</b> ${esc(x[6])}</div><div class="row"><b>⚠️ Riesgos:</b> ${esc(x[7])}</div><div class="step"><b>👉 Primer paso:</b> ${esc(x[8])}</div><div class="actions"><button class="view-btn" onclick="toggleDetail(${i},this)">Ver idea + prompt</button><button class="copy-btn" onclick="copyPrompt(${i},this)">Copiar prompt</button><span class="copy-status" id="status-${i}">Copiado ✓</span></div><div class="detail" id="detail-${i}"><h3>Descripción</h3><div class="description">${esc(desc)}</div><h3>Prompt para Work / ChatGPT / otro LLM</h3><div class="prompt-box">${esc(prompt)}</div></div></article>`}).join('');document.querySelector('#visible').textContent=filtered.length;document.querySelector('#empty').style.display=filtered.length?'none':'block'}function toggleDetail(i,btn){const el=document.getElementById(`detail-${i}`);el.classList.toggle('open');btn.textContent=el.classList.contains('open')?'Cerrar detalle':'Ver idea + prompt'}async function copyPrompt(i){const text=getPrompt(ideas[i]);try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const st=document.getElementById(`status-${i}`);if(st){st.style.display='inline';setTimeout(()=>st.style.display='none',1600)}}[q,cat,eff].forEach(e=>e.addEventListener('input',render));render();
</script></body></html>
