<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ideas de negocio · Pato</title><style>:root{--card:#151c31;--text:#f5f7fb;--muted:#aab3c5;--line:#29324a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#080c18,#111a31);color:var(--text)}main{max-width:1250px;margin:auto;padding:32px 18px 70px}h1{font-size:clamp(30px,5vw,54px);margin:0}.sub{color:var(--muted);margin:8px 0 28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.card{background:rgba(21,28,49,.94);border:1px solid var(--line);border-radius:18px}.stat{padding:16px}.stat b{font-size:26px;display:block}.stat span{color:var(--muted);font-size:13px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{background:#10172a;color:white;border:1px solid #33405d;border-radius:12px;padding:11px 13px;font-size:15px}.search{flex:1;min-width:240px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:20px}.tag{display:inline-block;background:#0e7490;color:#cffafe;border-radius:999px;padding:5px 9px;font-size:12px}.date{float:right;color:var(--muted);font-size:12px}.card h2{font-size:20px;margin:14px 0 10px}.row{margin:8px 0;color:#dbe2ee}.row b{color:white}.step{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;color:#cffafe}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.view-btn{background:#164e63;color:#cffafe;border:1px solid #155e75}.copy-btn{background:#67e8f9;color:#082f49}.detail{display:none;margin-top:16px;padding:16px;border:1px solid #334155;border-radius:14px;background:rgba(15,23,42,.75)}.detail.open{display:block}.detail h3{color:#67e8f9}.description{color:#dbeafe;line-height:1.55}.prompt-box{white-space:pre-wrap;background:#08101f;border:1px solid #27344e;border-radius:1 os"],["19/09/2026","Agencia que consigue alumnos a profesores de pádel","Pádel / Leads","200–1.000 €","Medio","2–4 h/semana","10–20 €/lead o cuota profesor","Conseguir tráfico","Landing Barcelona + 10 profesores"],["20/09/2026","Recepcionista IA por teléfono para clubes y academias","IA / Pádel","300–1.000 €","Medio","1–2 h/cliente","100–250 €/mes + consumo","Errores y coste de voz","Probar en Fairplay con 20 preguntas frecuentes"],["20/09/2026","Buscador automático de compañeros de pádel","Pádel / Plataforma","200–1.000 €","Medio","2–4 h/semana","Premium 3–5 €/mes o comisión","Masa crítica","Probar sólo en Barcelona"],["20/09/2026","Radar automático de garajes con rentabilidad objetivo","Inversión / Automatización","200–1.000 € + activo","Medio","1–2 h/semana","Renta del activo filtrando compras","Datos, cargas, liquidez","Monitorear 30 días sin comprar"],["20/09/2026","Coordinador IA para clubes de pádel","Pádel / SaaS","1.000–4.000 €","Medio/Alto","2–5 h/semana","79–199 €/club/mes","Personalización por club","Automatizar 3 decisiones repetitivas"],["20/09/2026","Explotar plazas grandes para coche + motos/bicis cuando sea viable","Inmobiliario","10.000–25.000 €/plaza","Bajo","<1 h/semana","150–250 €/mes según caso","Estatutos, seguro, normativa","Analizar 20 plazas y validar legalidad"],["21/09/2026","Pádel concierge para hoteles de Barcelona","Pádel / Turismo","500–2.000 €","Medio","2–4 h/semana","Comisión 15–30 € por reserva o fee al hotel","Estacionalidad, acuerdos y coordinación","Crear paquete piloto y ofrecerlo a 10 hoteles"],["21/09/2026","Americanas corporativas llave en mano para empresas","Pádel / Eventos B2B","300–1.000 €","Medio","2–5 h por evento","Margen objetivo 250–600 € por evento","Venta B2B, cancelaciones y pistas","Diseñar paquete y enviarlo a 20 empresas"],["21/09/2026","Auditoría express de IA y automatización para pymes","IA / Producto-servicio","100–500 €","Bajo/Medio","1–2 h/cliente","149–299 € por auditoría + upsell","Competencia, credibilidad, protección de datos","Crear checklist y hacer 3 auditorías piloto"],["21/09/2026","Micro-self-storage: comprar trasteros individuales para alquilar","Inmobiliario / Inversión","8.000–15.000 € por unidad","Bajo","<1 h/semana","Alquiler mensual según zona y gastos","Liquidez, comunidad, humedad, vacancia","Rastrear 30 trasteros y filtrar por rentabilidad"],["21/09/2026","Pack digital de onboarding y control para profesores de pádel","Pádel / Producto digital","100–400 €","Bajo/Medio","<1 h/semana","39–99 € por club o 9–19 €/mes","Mercado nicho, piratería y adquisición","Convertir procesos reales en kit mínimo"],["22/09/2026","Reactivación automática de horas valle para clubes de pádel","Pádel / Revenue automation","300–1.000 €","Medio","1–2 h/club/semana","150–300 €/mes por club + bonus","Medición incremental, consentimiento, integración","Medir horas valle y lanzar campañas segmentadas"],["22/09/2026","Migración y limpieza de datos para clubes que cambian de software","Pádel / Datos","100–500 €","Bajo/Medio","1–3 h por migración","250–750 € por migración","Datos inconsistentes, RGPD, formatos propietarios","Crear plantilla universal CSV/Sheets"],["22/09/2026","Microcurso de IA práctica para autónomos y pequeños negocios deportivos","IA / Producto digital","100–600 €","Medio","<1 h/semana","29–79 € por alumno","Mercado saturado, contenido envejece","Vender 10 plazas de taller piloto"],["22/09/2026","Radar de locales con potencial de cambio de uso o reconversión rentable","Inmobiliario / Datos","500–2.000 € + activo","Medio/Alto","2–3 h/semana","Plusvalía propia o informes/leads","Urbanismo, licencias, falsos positivos","Analizar 50 locales sin comprar"],["22/09/2026","Biblioteca de SOPs y automatizaciones para coordinadores deportivos por suscripción","Producto digital / Suscripción","150–700 €","Medio","1–2 h/semana","12–29 €/mes","Churn, novedades, nicho pequeño","Publicar 10 SOPs y ofrecer preventa"],["23/09/2026","Servicio de sponsors locales para clubes de pádel con reporting automático","Pádel / Sponsorship automation","200–700 €","Bajo/Medio","1–2 h/semana por club","Fee 20–30% o 99–199 €/mes","Venta B2B, demostrar retorno, tráfico del club","Crear dossier con 3 paquetes y probar con 10 comercios"],["23/09/2026","Alquiler autónomo de palas premium mediante lockers inteligentes","Pádel / Alquiler automatizado","1.500–4.000 € piloto","Medio","1–2 h/semana","6–10 €/alquiler; 8/día a 8 € ≈ 1.920 €/mes brutos","Robo/rotura, demanda, acuerdo con club, hardware","Probar 10 palas con QR sin locker durante 30 días"],["23/09/2026","Agente IA de cobros y facturas vencidas para microempresas","IA / Automatización financiera","200–800 €","Medio","<1–2 h/cliente/semana","79–199 €/mes + setup; 20 clientes a 129 € ≈ 2.580 €/mes","RGPD, tono, integraciones, límites jurídicos","MVP desde Sheets con recordatorios y aprobación humana"],["23/09/2026","Plazas de garaje con cargador eléctrico como activo premium","Inmobiliario / Electromovilidad","15.000–30.000 € + 1.000–2.500 € cargador","Medio","<1 h/semana","Prima objetivo +25–50 €/mes frente a plaza normal","Instalación, potencia/comunidad, demanda, retorno","Comparar 30 anuncios y pedir 3 presupuestos"],["23/09/2026","Servicio de implantación y documentación AI Act para pymes que usan IA sencilla","IA / Compliance productizado","300–1.000 €","Medio","1–3 h/cliente","250–750 € por pack + 49–99 €/mes","Responsabilidad legal, cambios normativos, casos complejos","Crear checklist low-risk y validarlo con profesional"]];function getDescription(x){return `Esta propuesta busca convertir “${x[1]}” en un negocio ejecutable dentro de ${x[2]}, validando primero con una versión pequeña y escalando sólo si alguien paga.`}function getPrompt(x){return `Analizá a fondo esta idea de negocio para Barcelona/España: “${x[1]}”. Categoría: ${x[2]}. Inversión: ${x[3]}. Esfuerzo: ${x[4]}. Mantenimiento: ${x[5]}. Modelo: ${x[6]}. Riesgos: ${x[7]}. Primer paso: ${x[8]}. Mi contexto: coordino una escuela de pádel en Barcelona y busco negocios automatizables con poco esfuerzo operativo. Investigá mercado y competidores actuales, cliente, problema, diferenciación, MVP, presupuesto, precios, costes, márgenes, escenarios conservador/razonable/ambicioso, clientes necesarios para 1.000 €, 3.000 € y 5.000 € netos/mes, automatización con IA, riesgos legales/fiscales/técnicos en España, plan 30/90/180 días, primeros 10 pasos y señales para abandonar. Marcá claramente las estimaciones.`}const grid=document.querySelector('#grid'),q=document.querySelector('#q'),cat=document.querySelector('#cat'),eff=document.querySelector('#eff');[...new Set(ideas.map(x=>x[2]))].sort().forEach(x=>cat.insertAdjacentHTML('beforeend',`<option>${x}</option>`));function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let s=q.value.toLowerCase();let a=ideas.map((x,i)=>({x,i})).filter(o=>(!s||o.x.join(' ').toLowerCase().includes(s))&&(!cat.value||o.x[2]===cat.value)&&(!eff.value||o.x[4]===eff.value));grid.innerHTML=a.map(o=>{let x=o.x,i=o.i,p=getPrompt(x);return `<article class="card"><span class="tag">${esc(x[2])}</span><span class="date">${x[0]}</span><h2>${esc(x[1])}</h2><div class="row"><b>💶 Inversión:</b> ${esc(x[3])}</div><div class="row"><b>⚙️ Esfuerzo:</b> ${esc(x[4])} · ${esc(x[5])}</div><div class="row"><b>📈 Modelo:</b> ${esc(x[6])}</div><div class="row"><b>⚠️ Riesgos:</b> ${esc(x[7])}</div><div class="step"><b>👉 Primer paso:</b> ${esc(x[8])}</div><div class="actions"><button class="view-btn" onclick="toggleDetail(${i},this)">Ver idea + prompt</button><button class="copy-btn" onclick="copyPrompt(${i})">Copiar prompt</button></div><div class="detail" id="detail-${i}"><h3>Descripción</h3><div class="description">${esc(getDescription(x))}</div><h3>Prompt para Work / ChatGPT / otro LLM</h3><div class="prompt-box">${esc(p)}</div></div></article>`}).join('');document.querySelector('#visible').textContent=a.length;document.querySelector('#empty').style.display=a.length?'none':'block'}function toggleDetail(i,b){let e=document.getElementById(`detail-${i}`);e.classList.toggle('open');b.textContent=e.classList.contains('open')?'Cerrar detalle':'Ver idea + prompt'}async function copyPrompt(i){let t=getPrompt(ideas[i]);try{await navigator.clipboard.writeText(t)}catch(e){}}[q,cat,eff].forEach(e=>e.addEventListener('input',render));render();</script></body></html>
