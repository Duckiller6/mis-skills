.card{padding:20px}

.row{margin:8px 0;color:#dbe2ee} .row b{color:white}
.step{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;color:#cffafe}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}

.description{color:#dbeafe;line-height:1.55;margin-bottom:16px}
.prompt-box{white-space:pre-wrap;background:#08101f;border:1px solid #27344e;border-radius:12px;padding:13px;color:#dbeafe;font:13px/1.5 ui-monospace,monospace;max-height:260px;overflow:auto}
.copy-status{font-size:12px;color:#a7f3d0;display:none;align-self:center}
.empty{display:none;text-align:center;color:var(--muted);padding:40px}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function getDescription(x){
  return `Propuesta de ${x[2]} centrada en “${x[1]}”. La lógica es validar primero con una versión pequeña y barata, comprobar que alguien esté dispuesto a pagar y después estandarizar o automatizar la operación. El modelo previsto es: ${x[6]}. El principal punto a vigilar es: ${x[7]}.`;
}

function getPrompt(x){
  return `Quiero que actúes como analista de negocios, emprendedor e inversor especializado en validar oportunidades reales en España.

Quiero desarrollar esta idea:
"${x[1]}"

Datos iniciales:
- Categoría: ${x[2]}
- Inversión estimada: ${x[3]}
- Esfuerzo inicial: ${x[4]}
- Mantenimiento: ${x[5]}
- Modelo de ingresos: ${x[6]}
- Riesgos detectados: ${x[7]}
- Primer paso sugerido: ${x[8]}

Contexto:
- Quiero un negocio realista, con posibilidad de automatización y poco trabajo operativo una vez montado.
- Estoy en Barcelona y puedo usar IA, Google Sheets, Make, WhatsApp, herramientas no-code y Vercel.
- Priorizá ingresos recurrentes, escalabilidad y validación barata antes de invertir fuerte.
- No quiero promesas de dinero fácil: cuestioná los supuestos y usá cifras realistas.

Desarrollá:
1. Quién pagaría y por qué.
2. Problema concreto que resuelve.
3. Mercado actual en Barcelona/España y tendencias recientes.
4. Competidores y precios.
5. Diferenciación posible.
6. MVP más barato para validar.
7. Presupuesto inicial detallado.
8. Precios y escenarios conservador/razonable/ambicioso.
9. Costes mensuales y margen.
10. Clientes necesarios para 1.000 €, 3.000 € y 5.000 € netos/mes.
11. Qué se puede automatizar con IA y qué requiere persona.
12. Riesgos legales, fiscales, técnicos y comerciales.
13. Plan 30/90/180 días.
14. Primeros 10 pasos exactos.
15. Señales para abandonar la idea antes de seguir gastando.
16. Qué validaría primero y cómo.

Si tenés acceso a Internet, verificá datos actuales con fuentes recientes. Si una cifra es estimada, aclaralo y explicá cómo comprobarla.`;
}

const grid=document.querySelector('#grid'),q=document.querySelector('#q'),cat=document.querySelector('#cat'),eff=document.querySelector('#eff');
[...new Set(ideas.map(x=>x[2]))].sort().forEach(x=>cat.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));

function render(){
  let s=q.value.toLowerCase();
  let filtered=ideas.map((x,idx)=>({x,idx})).filter(o=>
    (!s||o.x.join(' ').toLowerCase().includes(s)) &&
    (!cat.value||o.x[2]===cat.value) &&
    (!eff.value||o.x[4]===eff.value)
  );
  grid.innerHTML=filtered.map(o=>{
    const x=o.x,i=o.idx,desc=getDescription(x),prompt=getPrompt(x);
    return `<article class="card">
      <span class="tag">${esc(x[2])}</span><span class="date">${esc(x[0])}</span>
      <h2>${esc(x[1])}</h2>
      <div class="row"><b>💶 Inversión:</b> ${esc(x[3])}</div>
      <div class="row"><b>⚙️ Esfuerzo:</b> ${esc(x[4])} · ${esc(x[5])}</div>
      <div class="row"><b>📈 Modelo:</b> ${esc(x[6])}</div>
      <div class="row"><b>⚠️ Riesgos:</b> ${esc(x[7])}</div>
      <div class="step"><b>👉 Primer paso:</b> ${esc(x[8])}</div>
      <div class="actions">
        <button class="view-btn" onclick="toggleDetail(${i},this)">Ver idea + prompt</button>
        <button class="copy-btn" onclick="copyPrompt(${i})">Copiar prompt</button>
        <span class="copy-status" id="status-${i}">Copiado ✓</span>
      </div>
      <div class="detail" id="detail-${i}">
        <h3>Descripción</h3><div class="description">${esc(desc)}</div>
        <h3>Prompt para Work / ChatGPT / otro LLM</h3><div class="prompt-box">${esc(prompt)}</div>
      </div>
    </article>`;
  }).join('');
  document.querySelector('#visible').textContent=filtered.length;
  document.querySelector('#empty').style.display=filtered.length?'none':'block';
}

function toggleDetail(i,btn){
  const el=document.getElementById(`detail-${i}`);
  el.classList.toggle('open');
  btn.textContent=el.classList.contains('open')?'Cerrar detalle':'Ver idea + prompt';
}

async function copyPrompt(i){
  const text=getPrompt(ideas[i]);
  try{await navigator.clipboard.writeText(text)}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  const st=document.getElementById(`status-${i}`);
  if(st){st.style.display='inline';setTimeout(()=>st.style.display='none',1600)}
}

[q,cat,eff].forEach(e=>e.addEventListener('input',render));render();
</script>
