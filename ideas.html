<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ideas de negocio · Pato</title>
<style>
:root{--bg:#0b1020;--card:#151c31;--text:#f5f7fb;--muted:#aab3c5;--accent:#67e8f9;--accent2:#22d3ee;--line:#29324a;--panel:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#080c18,#111a31);color:var(--text)}
main{max-width:1250px;margin:auto;padding:32px 18px 70px}
h1{font-size:clamp(30px,5vw,54px);margin:0}
.sub{color:var(--muted);margin:8px 0 28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat,.card{background:rgba(21,28,49,.94);border:1px solid var(--line);border-radius:18px}
.stat{padding:16px} .stat b{font-size:26px;display:block} .stat span{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
input,select{background:#10172a;color:white;border:1px solid #33405d;border-radius:12px;padding:11px 13px;font-size:15px}
.search{flex:1;min-width:240px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{padding:20px;transition:.2s ease} .card:hover{border-color:#3b4a6a}
.tag{display:inline-block;background:#0e7490;color:#cffafe;border-radius:999px;padding:5px 9px;font-size:12px}
.date{float:right;color:var(--muted);font-size:12px}
.card h2{font-size:20px;margin:14px 0 10px}
.row{margin:8px 0;color:#dbe2ee} .row b{color:white}
.step{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;color:#cffafe}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}
.view-btn{background:#164e63;color:#cffafe;border:1px solid #155e75}
.copy-btn{background:#67e8f9;color:#082f49}
.detail{display:none;margin-top:16px;padding:16px;border:1px solid #334155;border-radius:14px;background:rgba(15,23,42,.75)}
.detail.open{display:block}
.detail h3{margin:0 0 8px;font-size:15px;color:#67e8f9}
.description{color:#dbeafe;line-height:1.55;margin-bottom:16px}
.prompt-box{white-space:pre-wrap;background:#08101f;border:1px solid #27344e;border-radius:12px;padding:13px;color:#dbeafe;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:260px;overflow:auto}
.copy-status{font-size:12px;color:#a7f3d0;display:none;margin-left:4px;align-self:center}
.empty{display:none;text-align:center;color:var(--muted);padding:40px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<h1>💡 Ideas de negocio de Pato</h1>
<div class="sub">Tu radar personal de oportunidades · Pádel · IA · Automatización · Inversión · Inmobiliario</div>
<div class="stats">
<div class="stat"><b id="total">15</b><span>Ideas guardadas</span></div>
<div class="stat"><b id="visible">15</b><span>Mostradas</span></div>
<div class="stat"><b>5/día</b><span>Nuevas propuestas</span></div>
<div class="stat"><b>13:00</b><span>Actualización prevista</span></div>
</div>
<div class="tools">
<input id="q" class="search" placeholder="Buscar idea, riesgo, categoría...">
<select id="cat"><option value="">Todas las categorías</option></select>
<select id="eff"><option value="">Cualquier esfuerzo</option><option>Bajo</option><option>Medio</option><option>Medio/Alto</option><option>Alto</option></select>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty">No encontré ideas con esos filtros.</div>
</main>
<script>
const ideas=[["19/09/2026", "Automatizaciones simples para clubes de pádel", "Pádel / Automatización", "200–800 €", "Medio", "1–3 h/cliente", "300–800 € instalación + 50–150 €/mes", "Personalización y soporte", "Crear paquete estándar y probarlo en Fairplay"], ["19/09/2026", "Producto digital de gestión para coordinadores de pádel", "Pádel / Producto digital", "100–500 €", "Medio", "<2 h/semana", "49–149 € por venta", "Copias y soporte", "Empaquetar plantillas, hojas y manual"], ["19/09/2026", "Agente de WhatsApp con IA para pequeños negocios", "IA / Automatización", "300–1.000 €", "Medio", "1–3 h/cliente", "150–250 €/mes por cliente", "Errores del bot y APIs", "Montar una demo para un negocio real"], ["19/09/2026", "Web automática de oportunidades de inversión y subastas", "Inversión / Inmobiliario", "500–2.000 €", "Medio", "2–4 h/semana", "Suscripción 10–20 €/mes + leads", "Datos incompletos", "Crear radar para garajes y subastas de Barcelona"], ["19/09/2026", "Microempresa de automatizaciones IA con paquetes cerrados", "IA / Servicios", "500–1.500 €", "Medio", "2–5 h/semana", "Paquetes + mantenimiento mensual", "Consultoría a medida", "Definir 3 servicios cerrados"], ["19/09/2026", "Local pequeño dividido en trasteros", "Inmobiliario", "40.000 €+", "Alto", "1–2 h/semana", "20 trasteros x 75 € = 1.500 €/mes brutos (ejemplo)", "Licencias, obra, demanda", "Buscar locales baratos y validar normativa"], ["19/09/2026", "Gestionar pistas de pádel de terceros", "Pádel / Gestión", "500–2.000 €", "Medio", "3–6 h/semana", "Fijo + porcentaje", "Dependencia del propietario", "Detectar 10 pistas infrautilizadas"], ["19/09/2026", "Cartera de plazas de parking con gestión automática", "Inmobiliario / Inversión", "15.000–20.000 €/plaza", "Bajo", "<1 h/semana", "100–150 €/mes por plaza aprox.", "Vacancia y derramas", "Definir rentabilidad mínima y buscar primera plaza"], ["19/09/2026", "Academia de pádel sin club propio", "Pádel / Educación", "1.000–3.000 €", "Medio/Alto", "5–10 h/semana", "Margen por grupo/hora", "Ocupación y coste de pistas", "Negociar horas valle y lanzar 5 grupos"], ["19/09/2026", "Agencia que consigue alumnos a profesores de pádel", "Pádel / Leads", "200–1.000 €", "Medio", "2–4 h/semana", "10–20 €/lead o cuota profesor", "Conseguir tráfico", "Landing Barcelona + 10 profesores"], ["20/09/2026", "Recepcionista IA por teléfono para clubes y academias", "IA / Pádel", "300–1.000 €", "Medio", "1–2 h/cliente", "100–250 €/mes + consumo", "Errores y coste de voz", "Probar en Fairplay con 20 preguntas frecuentes"], ["20/09/2026", "Buscador automático de compañeros de pádel", "Pádel / Plataforma", "200–1.000 €", "Medio", "2–4 h/semana", "Premium 3–5 €/mes o comisión", "Masa crítica", "Probar sólo en Barcelona"], ["20/09/2026", "Radar automático de garajes con rentabilidad objetivo", "Inversión / Automatización", "200–1.000 € + activo", "Medio", "1–2 h/semana", "Renta del activo filtrando compras", "Datos, cargas, liquidez", "Monitorear 30 días sin comprar"], ["20/09/2026", "Coordinador IA para clubes de pádel", "Pádel / SaaS", "1.000–4.000 €", "Medio/Alto", "2–5 h/semana", "79–199 €/club/mes", "Personalización por club", "Automatizar 3 decisiones repetitivas"], ["20/09/2026", "Explotar plazas grandes para coche + motos/bicis cuando sea viable", "Inmobiliario", "10.000–25.000 €/plaza", "Bajo", "<1 h/semana", "150–250 €/mes según caso", "Estatutos, seguro, normativa", "Analizar 20 plazas y validar legalidad"]];
const descriptions={"Automatizaciones simples para clubes de pádel": "Convertir tareas repetitivas de clubes —consultas, listas de espera, avisos, agrupación de alumnos o seguimiento— en paquetes de automatización que puedas instalar una vez y cobrar con mantenimiento recurrente.", "Producto digital de gestión para coordinadores de pádel": "Empaquetar tu forma de trabajar como coordinador en plantillas, hojas, procesos y manuales que otros clubes o coordinadores puedan comprar y usar sin necesitarte de forma constante.", "Agente de WhatsApp con IA para pequeños negocios": "Crear asistentes de WhatsApp que respondan preguntas, capten datos, filtren clientes y deriven sólo lo importante. El objetivo es vender una solución estándar a muchos negocios.", "Web automática de oportunidades de inversión y subastas": "Montar un radar que recopile y ordene oportunidades de subastas, garajes o inmuebles y las convierta en fichas fáciles de evaluar, monetizándolo con suscripción, leads o afiliación.", "Microempresa de automatizaciones IA con paquetes cerrados": "Vender automatizaciones muy concretas y con precio fijo —facturas, correos, seguimiento o atención— evitando proyectos eternos y reutilizando la misma solución entre clientes.", "Local pequeño dividido en trasteros": "Comprar o alquilar un local adecuado, acondicionarlo como mini-almacenes y obtener ingresos recurrentes mediante alquiler mensual con acceso y cobro lo más automatizados posible.", "Gestionar pistas de pádel de terceros": "Explotar pistas de hoteles, urbanizaciones o centros deportivos que hoy generan poco dinero, encargándote de reservas, escuela, torneos y profesores a cambio de fijo y/o porcentaje.", "Cartera de plazas de parking con gestión automática": "Construir una pequeña cartera de plazas compradas con criterios estrictos de rentabilidad y gestionarlas con cobros y contratos simples para generar una renta bastante pasiva.", "Academia de pádel sin club propio": "Crear una escuela propia usando horas valle alquiladas en clubes existentes. Vos aportás alumnos, profesores, organización y marca, sin asumir la inversión de tener instalaciones propias.", "Agencia que consigue alumnos a profesores de pádel": "Crear un canal de captación que conecte jugadores con profesores y monetizar cada lead, reserva o cuota profesional, aprovechando tu red y conocimiento real del mercado de pádel.", "Recepcionista IA por teléfono para clubes y academias": "Usar voz con IA para contestar llamadas, resolver preguntas frecuentes y captar datos cuando recepción no atiende, cobrando una cuota mensual por negocio.", "Buscador automático de compañeros de pádel": "Crear un sistema que cruce nivel, zona y disponibilidad para formar partidos o grupos compatibles y monetizarlo mediante premium, comisiones o acuerdos con clubes.", "Radar automático de garajes con rentabilidad objetivo": "Automatizar la búsqueda de plazas y filtrar sólo las que superen una rentabilidad mínima después de gastos, para que tu tiempo se concentre en oportunidades realmente interesantes.", "Coordinador IA para clubes de pádel": "Transformar procesos reales de coordinación —grupos, niveles, horarios, huecos y horas de profesores— en un software que ayude a clubes pequeños a operar con menos trabajo administrativo.", "Explotar plazas grandes para coche + motos/bicis cuando sea viable": "Buscar plazas sobredimensionadas cuya configuración y normativa permitan aprovechar mejor el espacio y aumentar la renta por metro cuadrado sin multiplicar demasiado la gestión."};
function getDescription(x){return descriptions[x[1]] || `Esta propuesta busca convertir "${x[1]}" en un negocio ejecutable dentro de ${x[2]}. La idea es arrancar con una versión pequeña, validar que alguien pague y recién después escalar, manteniendo la operación lo más liviana posible.`;}
function getPrompt(x){return `Quiero que actúes como un analista de negocios, emprendedor e inversor especializado en validar oportunidades reales en España.\n\nQuiero desarrollar esta idea de negocio:\n"${x[1]}"\n\nContexto de la idea:\n- Categoría: ${x[2]}\n- Inversión inicial estimada: ${x[3]}\n- Esfuerzo inicial: ${x[4]}\n- Mantenimiento estimado: ${x[5]}\n- Modelo de ingresos planteado: ${x[6]}\n- Riesgos detectados: ${x[7]}\n- Primer paso sugerido: ${x[8]}\n\nMi contexto:\n- Vivo en Barcelona.\n- Tengo experiencia real coordinando una escuela/club de pádel y gestionando profesores, alumnos, grupos, reservas y eventos.\n- Me interesan especialmente negocios que puedan automatizarse y que, una vez montados, requieran poco trabajo operativo.\n- Puedo utilizar IA, automatizaciones, Google Sheets, Make, WhatsApp, herramientas no-code y Vercel.\n- Me interesan modelos de ingresos recurrentes y activos que puedan escalar.\n- Quiero números realistas, no promesas de dinero fácil.\n\nDesarrollá esta idea a fondo y entregame:\n1. Explicación simple del negocio y exactamente quién pagaría.\n2. Problema que resuelve y por qué alguien compraría la solución.\n3. Investigación de mercado actual, especialmente Barcelona/España, usando fuentes recientes si tenés acceso a Internet.\n4. Competidores directos e indirectos y qué cobran.\n5. Forma concreta de diferenciarme.\n6. MVP más barato y rápido posible para validar la idea antes de invertir fuerte.\n7. Presupuesto inicial detallado en euros.\n8. Precios que podría cobrar y tres escenarios de ingresos: conservador, razonable y ambicioso.\n9. Costes mensuales y margen aproximado.\n10. Cuántos clientes/ventas necesito para llegar a 1.000 €, 3.000 € y 5.000 € netos mensuales.\n11. Qué tareas puedo automatizar con IA y cuáles requieren intervención humana.\n12. Riesgos legales, fiscales, técnicos y comerciales relevantes en España.\n13. Plan concreto de ejecución de 30, 90 y 180 días.\n14. Primeros 10 pasos exactos que debería realizar.\n15. Qué señales me indicarían que debo abandonar la idea antes de seguir gastando dinero.\n16. Una conclusión final basada en datos sobre qué tendría que validar primero.\n\nNo te limites a explicar la teoría: buscá puntos débiles, cuestioná las hipótesis y proponé acciones concretas. Si alguna cifra no puede saberse con seguridad, indicá que es una estimación y explicá cómo verificarla.`;}
const grid=document.querySelector('#grid'),q=document.querySelector('#q'),cat=document.querySelector('#cat'),eff=document.querySelector('#eff');
[...new Set(ideas.map(x=>x[2]))].sort().forEach(x=>cat.insertAdjacentHTML('beforeend',`<option>${x}</option>`));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let s=q.value.toLowerCase();let filtered=ideas.map((x,idx)=>({x,idx})).filter(o=>(!s||o.x.join(' ').toLowerCase().includes(s))&&(!cat.value||o.x[2]===cat.value)&&(!eff.value||o.x[4]===eff.value));grid.innerHTML=filtered.map(o=>{const x=o.x,i=o.idx,desc=getDescription(x),prompt=getPrompt(x);return `<article class="card"><span class="tag">${esc(x[2])}</span><span class="date">${esc(x[0])}</span><h2>${esc(x[1])}</h2><div class="row"><b>💶 Inversión:</b> ${esc(x[3])}</div><div class="row"><b>⚙️ Esfuerzo:</b> ${esc(x[4])} · ${esc(x[5])}</div><div class="row"><b>📈 Modelo:</b> ${esc(x[6])}</div><div class="row"><b>⚠️ Riesgos:</b> ${esc(x[7])}</div><div class="step"><b>👉 Primer paso:</b> ${esc(x[8])}</div><div class="actions"><button class="view-btn" onclick="toggleDetail(${i},this)">Ver idea + prompt</button><button class="copy-btn" onclick="copyPrompt(${i},this)">Copiar prompt</button><span class="copy-status" id="status-${i}">Copiado ✓</span></div><div class="detail" id="detail-${i}"><h3>Descripción</h3><div class="description">${esc(desc)}</div><h3>Prompt para Work / ChatGPT / otro LLM</h3><div class="prompt-box">${esc(prompt)}</div></div></article>`;}).join('');document.querySelector('#visible').textContent=filtered.length;document.querySelector('#empty').style.display=filtered.length?'none':'block';}
function toggleDetail(i,btn){const el=document.getElementById(`detail-${i}`);el.classList.toggle('open');btn.textContent=el.classList.contains('open')?'Cerrar detalle':'Ver idea + prompt';}
async function copyPrompt(i,btn){const text=getPrompt(ideas[i]);try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}const st=document.getElementById(`status-${i}`);if(st){st.style.display='inline';setTimeout(()=>st.style.display='none',1600)}}
[q,cat,eff].forEach(e=>e.addEventListener('input',render));render();
</script>
</body></html>
